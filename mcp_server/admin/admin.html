<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESPMCP 服务端管理后台</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--dim:#94a3b8;--acc:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.6 "Segoe UI",system-ui,sans-serif;padding:24px}
  h1{font-size:20px;margin-bottom:4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:15px;margin-bottom:12px;color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:600}
  label{display:block;color:var(--dim);font-size:12px;margin:8px 0 2px}
  input,select,textarea{width:100%;background:#0b1220;border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:6px 8px;font-size:13px}
  textarea{min-height:56px;font-family:Consolas,monospace;resize:vertical}
  button{background:var(--acc);border:none;color:#04202e;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  button.mini{padding:2px 8px;margin:0 2px;font-size:12px}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;margin-right:4px}
  .b-on{background:rgba(52,211,153,.15);color:var(--ok)}
  .b-off{background:rgba(248,113,113,.15);color:var(--bad)}
  .hint{color:var(--warn);font-size:12px;margin-top:8px;word-break:break-all}
  .empty{color:var(--dim);font-size:12px;padding:8px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  pre{background:#0b1220;border-radius:8px;padding:8px;font-size:11px;max-height:200px;overflow:auto;font-family:Consolas,monospace}
</style>
</head>
<body>
<h1>ESPMCP 服务端管理后台</h1>
<div class="sub">数据源网关 · 授权密钥 · 审计日志 —— 配置保存于 config/server_store.json</div>

<div class="grid">
  <!-- ===================== 数据源 ===================== -->
  <div class="card">
    <h2>① 外部数据源（公共查询 + JSON 参数白名单）</h2>
    <form id="srcForm">
      <div class="row2">
        <div><label>数据源 ID</label><input id="srcId" placeholder="orders" required></div>
        <div><label>名称</label><input id="srcName" placeholder="订单数据"></div>
      </div>
      <div class="row2">
        <div><label>类型</label>
          <select id="srcType"><option value="sqlite">sqlite（本地数据库）</option><option value="http">http（外部 REST 接口）</option></select>
        </div>
        <div><label>行数上限</label><input id="srcLimit" type="number" value="100"></div>
      </div>
      <label>连接信息 DSN（sqlite: 文件路径 / http: 基础地址）</label>
      <input id="srcDsn" placeholder="data/app.db 或 https://api.example.com/v1">
      <label>公共查询语句（sqlite 用 :param 命名占位；http 用 {param} 路径占位）</label>
      <textarea id="srcTpl" placeholder="SELECT id,city,amount,status FROM orders WHERE status = :status LIMIT :limit"></textarea>
      <label>参数白名单 JSON（参数名 -> 类型 str/int/float）</label>
      <textarea id="srcParams" placeholder='{"status":"str","limit":"int"}'></textarea>
      <label>默认参数 JSON</label>
      <textarea id="srcDefaults" placeholder='{"status":"paid","limit":10}'></textarea>
      <label>备注说明（会展示给 Agent）</label>
      <input id="srcDesc" placeholder="订单查询：可按状态过滤">
      <button type="submit">保存数据源</button>
      <button type="button" class="ghost" onclick="loadSources()">刷新列表</button>
    </form>
    <div id="srcList" style="margin-top:12px"></div>
  </div>

  <!-- ===================== 密钥 ===================== -->
  <div class="card">
    <h2>② 授权公共密钥（客户端凭此访问数据源）</h2>
    <label>密钥备注</label>
    <input id="keyNote" placeholder="给 Demo 客户端使用">
    <label>绑定数据源（多选，留空表示暂不授权）</label>
    <div id="keySrcChecks" class="empty">加载中...</div>
    <button onclick="createKey()">签发密钥</button>
    <div id="newKey" class="hint"></div>
    <div id="keyList" style="margin-top:12px"></div>
  </div>

  <!-- ===================== 审计 ===================== -->
  <div class="card" style="grid-column:1/-1">
    <h2>③ 查询审计日志（最近 50 条）</h2>
    <button class="ghost mini" onclick="loadAudit()">刷新</button>
    <div id="auditList" style="margin-top:8px"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const api=async(u,o)=>{const r=await fetch(u,o);const j=await r.json();if(!j.ok)throw j.error;return j.data};

function renderSources(list){
  if(!list.length){$('srcList').innerHTML='<div class="empty">暂无数据源，请先在左侧添加。</div>';return}
  $('srcList').innerHTML='<table><tr><th>ID</th><th>类型</th><th>查询语句</th><th>操作</th></tr>'+
    list.map(s=>`<tr><td><b>${s.id}</b><br><span style="color:var(--dim)">${s.name||''}</span></td>
      <td>${s.type}</td><td style="font-family:Consolas;font-size:11px">${s.query_template}</td>
      <td><button class="danger mini" onclick="delSource('${s.id}')">删除</button></td></tr>`).join('')+'</table>';
}
async function loadSources(){renderSources(await api('/admin/api/sources'));renderKeyChecks()}
async function delSource(id){if(!confirm('删除数据源 '+id+'？'))return;await api('/admin/api/sources/'+id,{method:'DELETE'});loadSources()}

$('srcForm').onsubmit=async e=>{
  e.preventDefault();
  try{
    await api('/admin/api/sources',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      id:$('srcId').value.trim(),name:$('srcName').value.trim(),type:$('srcType').value,dsn:$('srcDsn').value.trim(),
      query_template:$('srcTpl').value.trim(),
      allowed_params:JSON.parse($('srcParams').value||'{}'),
      default_params:JSON.parse($('srcDefaults').value||'{}'),
      row_limit:+$('srcLimit').value||100, description:$('srcDesc').value.trim()})});
    loadSources();$('srcForm').reset();$('srcLimit').value=100;
  }catch(err){alert(err)}
};

function renderKeyChecks(){
  api('/admin/api/sources').then(list=>{
    $('keySrcChecks').innerHTML=list.length?list.map(s=>
      `<label style="display:inline-flex;align-items:center;gap:4px;margin-right:12px"><input type="checkbox" class="keySrc" value="${s.id}">${s.id}</label>`).join('')
      :'<span class="empty">尚无数据源</span>';
  });
}
async function createKey(){
  const allowed=[...document.querySelectorAll('.keySrc:checked')].map(c=>c.value);
  const d=await api('/admin/api/keys',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({note:$('keyNote').value.trim(),allowed_sources:allowed})});
  $('newKey').textContent='⚠ 密钥仅显示一次，请立即复制：'+d.key;
  loadKeys();
}
function renderKeys(list){
  if(!list.length){$('keyList').innerHTML='<div class="empty">暂无密钥。注意：未配置任何密钥时服务器处于开放模式。</div>';return}
  $('keyList').innerHTML='<table><tr><th>密钥</th><th>授权数据源</th><th>状态</th><th>操作</th></tr>'+
    list.map(k=>`<tr><td><b>${k.prefix}…</b><br><span style="color:var(--dim)">${k.note||''}</span></td>
      <td>${(k.allowed_sources||[]).join(', ')||'无'}</td>
      <td><span class="badge ${k.enabled?'b-on':'b-off'}">${k.enabled?'启用':'停用'}</span></td>
      <td><button class="ghost mini" onclick="toggleKey('${k.id}')">${k.enabled?'停用':'启用'}</button>
          <button class="danger mini" onclick="delKey('${k.id}')">删除</button></td></tr>`).join('')+'</table>';
}
async function loadKeys(){renderKeys(await api('/admin/api/keys'))}
async function toggleKey(id){await api(`/admin/api/keys/${id}/toggle`,{method:'POST'});loadKeys()}
async function delKey(id){if(!confirm('删除该密钥？'))return;await api('/admin/api/keys/'+id,{method:'DELETE'});loadKeys()}

function renderAudit(list){
  if(!list.length){$('auditList').innerHTML='<div class="empty">暂无查询记录</div>';return}
  $('auditList').innerHTML='<table><tr><th>时间</th><th>数据源</th><th>结果</th></tr>'+
    list.map(a=>`<tr><td>${a.ts}</td><td>${a.source}</td><td>${a.ok?`成功 ${a.rows} 行`:`<span style="color:var(--bad)">失败: ${a.error||''}</span>`}</td></tr>`).join('')+'</table>';
}
async function loadAudit(){renderAudit(await api('/admin/api/audit?limit=50'))}

loadSources();loadKeys();loadAudit();
</script>
</body>
</html>
