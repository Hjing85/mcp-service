<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESPMCP 客户端控制台</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--dim:#94a3b8;--acc:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.6 "Segoe UI",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:17px} header .sub{color:var(--dim);font-size:12px}
  main{flex:1;display:grid;grid-template-columns:360px 1fr;overflow:hidden}
  .left{border-right:1px solid var(--line);overflow-y:auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .card h2{font-size:14px;color:var(--acc);margin-bottom:10px}
  label{display:block;color:var(--dim);font-size:12px;margin:8px 0 2px}
  input,select{width:100%;background:#0b1220;border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:6px 8px;font-size:13px}
  button{background:var(--acc);border:none;color:#04202e;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  button.mini{padding:2px 8px;margin:0;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--dim)}
  .hint{color:var(--warn);font-size:12px;word-break:break-all;margin-top:6px}
  .err{color:var(--bad);font-size:12px;margin-top:6px;white-space:pre-wrap}
  /* 对话区 */
  .right{display:flex;flex-direction:column}
  #msgs{flex:1;overflow-y:auto;padding:20px 28px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:78%;border-radius:12px;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
  .user{align-self:flex-end;background:#2563eb;color:#fff}
  .bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
  .steps{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px}
  .steps details{margin-bottom:6px}
  .steps summary{color:var(--acc);cursor:pointer}
  .steps pre{background:#0b1220;border-radius:8px;padding:6px;font-size:11px;overflow:auto;max-height:150px;font-family:Consolas,monospace;white-space:pre-wrap}
  .composer{border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px}
  #input{flex:1;background:#0b1220;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:10px;font-size:14px;resize:none;height:64px}
  #status{font-size:12px;color:var(--dim);padding:0 28px 8px}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;margin-left:8px;background:rgba(56,189,248,.15);color:var(--acc)}
  .tools{font-size:12px;color:var(--dim)}
  .tools span{display:inline-block;background:#0b1220;border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0}
</style>
</head>
<body>
<header>
  <div><h1>ESPMCP 客户端控制台</h1><div class="sub">模型对接配置 · MCP Server 连接 · 智能对话</div></div>
  <div id="connState" class="sub">未连接</div>
</header>
<main>
  <div class="left">
    <!-- 模型配置 -->
    <div class="card">
      <h2>① 模型对接配置（按系统分别配置 Key）</h2>
      <form id="pForm">
        <label>配置 ID（唯一标识）</label><input id="pId" placeholder="qwen" required>
        <label>协议类型</label>
        <select id="pType"><option value="openai_compatible">OpenAI 兼容（国内外绝大多数）</option><option value="anthropic">Anthropic Claude</option></select>
        <label>Base URL</label><input id="pUrl" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1">
        <label>模型名称</label><input id="pModel" placeholder="qwen-max">
        <label>API Key（留空则保留已保存的 Key）</label><input id="pKey" type="password" placeholder="sk-...">
        <label>备用：从环境变量读取（api_key_env）</label><input id="pEnv" placeholder="DASHSCOPE_API_KEY">
        <label>备注</label><input id="pNote" placeholder="生产环境-通义千问">
        <button type="submit">保存配置</button>
        <button type="button" class="ghost" onclick="loadProviders()">刷新</button>
      </form>
      <div id="pErr" class="err"></div>
      <div id="pList" style="margin-top:10px"></div>
    </div>

    <!-- 连接配置 -->
    <div class="card">
      <h2>② MCP Server 连接配置</h2>
      <label>Server 地址</label><input id="cUrl" value="http://localhost:8000/sse">
      <label>传输方式</label>
      <select id="cTransport"><option value="sse">SSE</option><option value="streamable-http">Streamable HTTP</option></select>
      <label>公共 Key（服务端 /admin 签发的 pk_...）</label><input id="cToken" type="password" placeholder="pk_...">
      <label>系统提示词</label><input id="cSystem" value="你是一个乐于助人的智能助手，可以使用提供的工具回答问题。">
      <button onclick="testConnect()">测试连接 & 获取工具列表</button>
      <div id="cErr" class="err"></div>
      <div id="toolList" class="tools" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- 对话区 -->
  <div class="right">
    <div id="msgs"></div>
    <div id="status"></div>
    <div class="composer">
      <textarea id="input" placeholder="输入问题，例如：查一下 orders 数据源中 status=paid 的订单（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="sendBtn" onclick="send()">发送</button>
      <button class="ghost" onclick="newSession()">新会话</button>
    </div>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
let SESSION='default';
const api=async(u,o)=>{
  const r=await fetch(u,o);const t=await r.text();
  let j;try{j=JSON.parse(t)}catch{throw `服务端返回非JSON响应(HTTP ${r.status}): ${t.slice(0,100)}`}
  if(!j.ok)throw typeof j.error==='string'?j.error:(j.detail||'请求失败');return j.data};

/* ---------- 模型配置 ---------- */
async function loadProviders(){
  const data=await api('/api/providers');
  const rows=Object.values(data);
  $('pList').innerHTML=rows.length?`<table><tr><th>ID</th><th>模型</th><th>Key</th><th></th></tr>`+
    rows.map(p=>`<tr><td><b>${p.id}</b></td><td>${p.model||''}</td>
      <td>${p.has_key?`✓ …${p.key_tail}`:`<span style="color:var(--bad)">未配置</span>`}</td>
      <td><button class="danger mini" onclick="delProvider('${p.id}')">删</button></td></tr>`).join('')+'</table>'
    :'<div style="color:var(--dim);font-size:12px">暂无配置</div>';
}
$('pForm').onsubmit=async e=>{
  e.preventDefault();$('pErr').textContent='';
  try{
    await api('/api/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      id:$('pId').value.trim(),type:$('pType').value,base_url:$('pUrl').value.trim(),model:$('pModel').value.trim(),
      api_key:$('pKey').value.trim(),api_key_env:$('pEnv').value.trim(),note:$('pNote').value.trim()})});
    $('pKey').value='';loadProviders();
  }catch(err){$('pErr').textContent=err}
};
async function delProvider(id){if(!confirm('删除配置 '+id+'？'))return;await api('/api/providers/'+id,{method:'DELETE'});loadProviders()}

/* ---------- 连接 ---------- */
function connParams(){return {provider:curProvider(),server_url:$('cUrl').value.trim(),transport:$('cTransport').value,token:$('cToken').value.trim()}}
function curProvider(){const sel=$('pSel');return sel?sel.value:''}

async function testConnect(){
  $('cErr').textContent='';$('toolList').innerHTML='';$('connState').textContent='连接中...';
  try{
    const tools=await api(`/api/tools?provider=${encodeURIComponent(curProvider())}&server_url=${encodeURIComponent($('cUrl').value.trim())}&transport=${$('cTransport').value}&token=${encodeURIComponent($('cToken').value.trim())}`);
    $('connState').textContent=`已连接 · ${tools.length} 个工具`;
    $('toolList').innerHTML='可用工具: '+(tools.map(t=>`<span title="${t.description||''}">${t.name}</span>`).join('')||'无');
  }catch(err){$('connState').textContent='连接失败';$('cErr').textContent=err}
}

/* ---------- 对话 ---------- */
function addMsg(role,text,steps){
  const div=document.createElement('div');div.className='msg '+role;
  div.textContent=text;
  if(steps&&steps.length){
    const s=document.createElement('div');s.className='steps';
    s.innerHTML='<details open><summary>工具调用过程（'+steps.length+' 次）</summary>'+
      steps.map(st=>`<div><b>${st.tool}</b><pre>参数: ${JSON.stringify(st.args)}\n结果: ${st.result}</pre></div>`).join('')+'</details>';
    div.appendChild(s);
  }
  $('msgs').appendChild(div);$('msgs').scrollTop=$('msgs').scrollHeight;
}
function status(t){$('status').textContent=t||''}

async function send(){
  const text=$('input').value.trim();if(!text)return;
  const p=connParams();
  if(!p.provider){alert('请先在左侧选择或保存一个模型配置');return}
  $('input').value='';addMsg('user',text);status('思考中...');$('sendBtn').disabled=true;
  try{
    const d=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...p,message:text,session_id:SESSION,system_prompt:$('cSystem').value.trim()})});
    addMsg('bot',d.answer||'(无回答)',d.steps);
  }catch(err){addMsg('bot','⚠ 出错：'+err)}
  status('');$('sendBtn').disabled=false;
}
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

async function newSession(){
  await api('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:SESSION})});
  SESSION=Math.random().toString(36).slice(2,10);$('msgs').innerHTML='';status('新会话: '+SESSION);
}

/* 初始化：填充 provider 下拉 */
async function init(){
  await loadProviders();
  const rows=Object.values(await api('/api/providers'));
  const sel=document.createElement('div');
  sel.innerHTML='<label>当前使用的模型配置</label><select id="pSel">'+
    rows.map(p=>`<option value="${p.id}">${p.id} (${p.model||''})</option>`).join('')+'</select>';
  document.querySelectorAll('.card')[0].appendChild(sel);
}
init();
</script>
</body>
</html>
